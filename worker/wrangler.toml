name = "shopify-netsuite-returns-worker"
main = "src/index.js"
compatibility_date = "2025-03-01"

[vars]
SHOPIFY_API_VERSION = "2026-04"
SHOPIFY_APP_HANDLE = "netsuite-returns-2"
R2_PUBLIC_DOMAIN = "https://shopify-netsuite-returns-worker.holy-waterfall-8e46.workers.dev"
STOREFRONT_BASE_URL = "https://shopify-netsuite-returns.holy-waterfall-8e46.workers.dev/"


[observability]
enabled = false


[[d1_databases]]
binding = "DB"
database_name = "netsuite-returns-db"
database_id = "a7ee5883-f7da-4217-b1f4-4867615e6285"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "netsuite-returns-attachments"